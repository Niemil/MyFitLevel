name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MyFitLevel.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyFitLevel.apk --title "MyFitLevel Android (latest build)" --notes "Download MyFitLevel.apk on your phone and install it. Built from commit ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        with:
          name: MyFitLevel-apk
          path: MyFitLevel.apk
