name: Deploy website to myfitlevel.com

# Every push to main that changes web/ is checked (PHP syntax) and uploaded by FTP.
# Needs four repository secrets: FTP_SERVER, FTP_USER, FTP_PASS, FTP_DIR.
# Until they exist this workflow does nothing, so it is safe to leave switched on.
# Secrets (web/config/config.php, installed.lock), logs and uploads stay on the server and are never uploaded.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - name: Check that deploy secrets exist
        id: gate
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ] && [ -n "$FTP_DIR" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets are not set yet, so nothing was deployed."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: shivammathur/setup-php@v2
        if: steps.gate.outputs.go == 'yes'
        with:
          php-version: '8.3'
      - name: Check PHP syntax (nothing is uploaded if there is an error)
        if: steps.gate.outputs.go == 'yes'
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::Syntax error"; fail=1; }
          done < <(find web -name '*.php' -print0)
          exit $fail
      - name: Upload changed files
        if: steps.gate.outputs.go == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_DIR }}/
          local-dir: ./web/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            config/config.php
            config/installed.lock
            config/*.log
            **/errors.log
            public/uploads/**
            .ftpquota
