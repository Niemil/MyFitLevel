-- SnakeDiet for Linux (Conky + curl + jq). Edit the key in the lines below, then run: conky -c myfitlevel.conky.conf
conky.config = {
  alignment = 'top_left', gap_x = 40, gap_y = 40, minimum_width = 300,
  update_interval = 300, own_window = true, own_window_type = 'desktop',
  own_window_transparent = false, own_window_colour = '0f1b2a', own_window_argb_visual = true, own_window_argb_value = 215,
  double_buffer = true, use_xft = true, font = 'DejaVu Sans:size=10',
  default_color = 'ffffff', color1 = '2bb3a3', draw_borders = false,
};
conky.text = [[
${color1}${font DejaVu Sans:bold:size=20}${execi 300 curl -s "https://snakediet.org/api/v1/widget?key=PASTE_YOUR_API_KEY_HERE" | jq -r '"LV \(.level)"'}${font}${color}   ${execi 300 curl -s "https://snakediet.org/api/v1/widget?key=PASTE_YOUR_API_KEY_HERE" | jq -r '.name'}
${execi 300 curl -s "https://snakediet.org/api/v1/widget?key=PASTE_YOUR_API_KEY_HERE" | jq -r '"\(.xp) points  |  streak \(.streak)  |  \(.fast_hours) h fasting now  |  week \(.week_points) KTN\n\(.today_label)"'}
]];
